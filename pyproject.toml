[tool.mypy]
python_version = "3.11"
strict = true
files = ["server.py", "chats.py", "parsers.py", "config.py", "tests", "web/tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "SIM", "S", "PL", "RUF", "BLE", "PTH", "ARG", "RET", "PIE", "C4", "ISC", "TRY", "PERF", "N", "I"]
ignore = [
    "TRY003",   # error messages are written where the error is raised; ChatError/ValidationError carry them to the user
    "PLR2004",  # the few literal limits (stderr lines, PR digits, test bounds) read better in place than as named constants
    "S603",     # every command is a validated argument list, never a shell (AGENTS.md security rules)
    "S607",     # gh, git and claude are looked up on PATH by design; the config chooses relative programs
    "PLC0415",  # the SDK is imported lazily so the server runs without it; test fakes import after setting sys.path
    "N812",     # one-letter module aliases (P = parsers, K = config, C = chats) are this codebase's convention
    "PLR0911",  # request routers and validators are flat if/return ladders; splitting them hides the dispatch
    "PLR0912",  # same: flat dispatch over message or action kinds
    "PLR0915",  # same: the chat session loop is one sequential coroutine
]

[tool.ruff.lint.isort]
known-first-party = ["chats", "config", "parsers", "server", "tests", "fake_sdk", "fake_server"]
